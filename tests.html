<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>آزمایش عددی شرکت فضایی نیایش</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="sheet">
    <h1>آزمایش‌های عددی</h1>
    <p id="sum">در حال حساب...</p>
    <ul id="list"></ul>
  </main>
  <script type="module">
    import { runAll } from "./tests/suite.js";
    const checks = runAll();
    const list = document.querySelector("#list");
    checks.forEach((item) => {
      const li = document.createElement("li");
      li.textContent = (item.ok ? "قبول" : "رد") + " — " + item.name + (item.detail ? " (" + item.detail + ")" : "");
      list.append(li);
    });
    const bad = checks.filter((item) => !item.ok).length;
    document.querySelector("#sum").textContent = bad ? bad + " آزمایش رد شد" : "همه‌ی آزمایش‌ها قبول شدند";
  </script>
</body>
</html>
